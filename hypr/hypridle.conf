general {
    lock_cmd = qs ipc call nisfere-lock trigger
    
    before_sleep_cmd = qs ipc call nisfere-lock trigger
    
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = qs ipc call nisfere-lock trigger
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}